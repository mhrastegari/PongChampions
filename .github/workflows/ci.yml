name: backend
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore PongChampions.slnx
      - run: dotnet build PongChampions.slnx -c Release --no-restore --warnaserror
      - run: dotnet test PongChampions.slnx -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
      - run: docker build -t pongchampions:ci .
      - name: Verify Compose startup and migrations
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-disposable-password
          JWT_KEY: ci-only-disposable-key-at-least-thirty-two-bytes
          API_IMAGE: pongchampions:ci
        run: |
          docker compose up -d --no-build
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/health/ready
      - name: Clean up Compose
        if: always()
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-disposable-password
          JWT_KEY: ci-only-disposable-key-at-least-thirty-two-bytes
        run: docker compose down -v
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
