<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="hsl(232 28% 7%)" />
    <meta
      name="description"
      content="Real-time multiplayer Pong. Host a room, share the code and play."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pong Champions</title>
    <script>
      // Apply the stored theme before first paint to avoid a light flash.
      (function () {
        try {
          var stored = localStorage.getItem('pc.theme');
          var theme = stored ? JSON.parse(stored) : 'system';
          var dark =
            theme === 'dark' ||
            (theme !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
